services:
  app:
    container_name: url-shortener
    build:
      context: .
      dockerfile: Dockerfile
    image: url-shortener:latest
    ports:
      - "3000:3000"
    command: ["/app/url-shortener"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: user
      DB_PASSWORD: app
      DB_NAME: url_shortener_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD:
      REDIS_DB: 0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    entrypoint: ["goose", "-dir", "/app/db/migrations"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}

  db:
    image: postgres:latest
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: app
      POSTGRES_DB: url_shortener_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "url_shortener_dev"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: url-shortener-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
